<rect width="1500" height="900" fill="#fbfaf7"/>
<text x="80" y="52" font-size="26" fill="#222" text-anchor="start" font-weight="700">Pokédex side views: closed and open</text>
<text x="80" y="80" font-size="15" fill="#666" text-anchor="start" font-weight="400">Same scale as the app (1.2 × CSS px). Thicknesses are a proposal to discuss. Dashed line = the table.</text>
<g><circle cx="92" cy="135" r="12" fill="#222"/><text x="92" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">A</text><text x="112" y="140" font-size="16" fill="#222" text-anchor="start" font-weight="700">Closed, seen from the top edge</text><text x="112" y="160" font-size="13" fill="#777" text-anchor="start" font-weight="400">Sensor plate (left) and lid (right) meet at the same level: one flat top.</text></g><line x1="60" y1="250" x2="613.6" y2="250" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/><rect x="80" y="228.4" width="480" height="21.599999999999998" fill="#d4122f" stroke="#6d0615" stroke-width="1.5" rx="3"/><rect x="80" y="216.4" width="312" height="12" fill="#ef4a60" stroke="#6d0615" stroke-width="1.5" /><rect x="392" y="216.4" width="168" height="12" fill="#e8344c" stroke="#6d0615" stroke-width="1.5" /><rect x="104" y="212.8" width="79.2" height="3.5999999999999996" rx="2" fill="#cfd3d8" stroke="#8d939a" stroke-width="1"/><circle cx="576.8" cy="233.2" r="16.8" fill="url(#hinge)" stroke="#6d0615" stroke-width="1.5"/><line x1="392" y1="202.4" x2="392" y2="228.4" stroke="#222" stroke-width="1.5" stroke-dasharray="3 3"/><text x="392" y="196.4" font-size="12" fill="#222" text-anchor="middle" font-weight="400">seam: plate | lid</text><text x="104" y="204.4" font-size="12" fill="#666" text-anchor="start" font-weight="400">lens</text><g stroke="#555" stroke-width="1"><line x1="50" y1="250" x2="50" y2="228.4"/><line x1="46" y1="250" x2="54" y2="250"/><line x1="46" y1="228.4" x2="54" y2="228.4"/></g><text x="58" y="243.2" font-size="12" fill="#555" text-anchor="start" font-weight="400">18</text><g stroke="#555" stroke-width="1"><line x1="617.6" y1="228.4" x2="617.6" y2="216.4"/><line x1="613.6" y1="228.4" x2="621.6" y2="228.4"/><line x1="613.6" y1="216.4" x2="621.6" y2="216.4"/></g><text x="625.6" y="226.4" font-size="12" fill="#555" text-anchor="start" font-weight="400">10</text><text x="80" y="276" font-size="12" fill="#666" text-anchor="start" font-weight="400">base 18  ·  plate / lid 10  ·  total 28 = hinge Ø 28</text><g><circle cx="92" cy="315" r="12" fill="#222"/><text x="92" y="320" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">B</text><text x="112" y="320" font-size="16" fill="#222" text-anchor="start" font-weight="700">Closed, seen from the bottom edge</text><text x="112" y="340" font-size="13" fill="#777" text-anchor="start" font-weight="400">At the bottom the lid covers the whole width.</text></g><line x1="60" y1="420" x2="613.6" y2="420" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/><rect x="80" y="398.4" width="480" height="21.599999999999998" fill="#d4122f" stroke="#6d0615" stroke-width="1.5" rx="3"/><rect x="80" y="386.4" width="480" height="12" fill="#e8344c" stroke="#6d0615" stroke-width="1.5" /><circle cx="576.8" cy="403.2" r="16.8" fill="url(#hinge)" stroke="#6d0615" stroke-width="1.5"/><g><circle cx="702" cy="135" r="12" fill="#222"/><text x="702" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">C</text><text x="722" y="140" font-size="16" fill="#222" text-anchor="start" font-weight="700">Closed, seen from the outer side</text><text x="722" y="160" font-size="13" fill="#777" text-anchor="start" font-weight="400">Top of the device on the left, bottom on the right.</text></g><line x1="670" y1="250" x2="1391.6" y2="250" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/><rect x="690" y="228.4" width="681.6" height="21.599999999999998" fill="#d4122f" stroke="#6d0615" stroke-width="1.5" rx="3"/><rect x="690" y="216.4" width="124.8" height="12" fill="#ef4a60" stroke="#6d0615" stroke-width="1.5" /><rect x="814.8" y="216.4" width="556.8" height="12" fill="#e8344c" stroke="#6d0615" stroke-width="1.5" /><rect x="714" y="212.8" width="79.2" height="3.5999999999999996" rx="2" fill="#cfd3d8" stroke="#8d939a" stroke-width="1"/><line x1="814.8" y1="202.4" x2="814.8" y2="228.4" stroke="#222" stroke-width="1.5" stroke-dasharray="3 3"/><text x="814.8" y="196.4" font-size="12" fill="#222" text-anchor="middle" font-weight="400">step at 104</text><text x="690" y="276" font-size="12" fill="#666" text-anchor="start" font-weight="400">plate: top 104 of the height  ·  lid: the rest</text><g><circle cx="92" cy="515" r="12" fill="#222"/><text x="92" y="520" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">D</text><text x="112" y="520" font-size="16" fill="#222" text-anchor="start" font-weight="700">Open, seen from the top edge</text><text x="112" y="540" font-size="13" fill="#777" text-anchor="start" font-weight="400">The lid lies lower than the base. Pale = the lid surface further back, behind its step.</text></g><line x1="60" y1="640" x2="1093.6" y2="640" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/><rect x="80" y="618.4" width="480" height="21.599999999999998" fill="#d4122f" stroke="#6d0615" stroke-width="1.5" rx="3"/><rect x="80" y="606.4" width="312" height="12" fill="#ef4a60" stroke="#6d0615" stroke-width="1.5" /><rect x="104" y="602.8" width="79.2" height="3.5999999999999996" rx="2" fill="#cfd3d8" stroke="#8d939a" stroke-width="1"/><circle cx="576.8" cy="623.2" r="16.8" fill="url(#hinge)" stroke="#6d0615" stroke-width="1.5"/><rect x="593.6" y="628" width="480" height="12" fill="#f6a3ae" stroke="#6d0615" stroke-width="1.5" rx="3" stroke-dasharray="4 3"/><rect x="593.6" y="628" width="168" height="12" fill="#e8344c" stroke="#6d0615" stroke-width="1.5" /><text x="677.6" y="662" font-size="12" fill="#444" text-anchor="middle" font-weight="400">lid's tall part (140)</text><text x="917.6" y="662" font-size="12" fill="#999" text-anchor="middle" font-weight="400">lower part, set back by the step</text><text x="236" y="662" font-size="12" fill="#444" text-anchor="middle" font-weight="400">sensor plate (260)</text><g stroke="#555" stroke-width="1"><line x1="1097.6" y1="640" x2="1097.6" y2="628"/><line x1="1093.6" y1="640" x2="1101.6" y2="640"/><line x1="1093.6" y1="628" x2="1101.6" y2="628"/></g><text x="1105.6" y="638" font-size="12" fill="#555" text-anchor="start" font-weight="400">10</text><g stroke="#555" stroke-width="1"><line x1="50" y1="640" x2="50" y2="606.4"/><line x1="46" y1="640" x2="54" y2="640"/><line x1="46" y1="606.4" x2="54" y2="606.4"/></g><text x="58" y="627.2" font-size="12" fill="#555" text-anchor="start" font-weight="400">28</text><g><circle cx="92" cy="715" r="12" fill="#222"/><text x="92" y="720" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">E</text><text x="112" y="720" font-size="16" fill="#222" text-anchor="start" font-weight="700">Open, seen from the bottom edge</text><text x="112" y="740" font-size="13" fill="#777" text-anchor="start" font-weight="400">Base 18 thick, lid 10 thick, joined by the hinge.</text></g><line x1="60" y1="820" x2="1093.6" y2="820" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/><rect x="80" y="798.4" width="480" height="21.599999999999998" fill="#d4122f" stroke="#6d0615" stroke-width="1.5" rx="3"/><circle cx="576.8" cy="803.2" r="16.8" fill="url(#hinge)" stroke="#6d0615" stroke-width="1.5"/><rect x="593.6" y="808" width="480" height="12" fill="#e8344c" stroke="#6d0615" stroke-width="1.5" rx="3"/><text x="1180" y="488" font-size="14" fill="#222" text-anchor="start" font-weight="700">Where each view looks from</text><rect x="1180" y="560" width="128" height="181.76" rx="3" fill="#d4122f" stroke="#6d0615"/><path d="M1180,560 L1263.2,560 C1256.8,560 1250.4,593.28 1244,593.28 L1180,593.28 Z" fill="#ef4a60" stroke="#6d0615"/><rect x="1308" y="560" width="8.96" height="181.76" fill="url(#hinge)" stroke="#6d0615"/><path d="M1316.96,560 L1361.76,560 C1368.16,560 1374.56,593.28 1380.96,593.28 L1444.96,593.28 L1444.96,741.76 L1316.96,741.76 Z" fill="#e8344c" stroke="#6d0615"/><line x1="1221.6" y1="520" x2="1221.6" y2="554" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><text x="1221.6" y="514" font-size="13" fill="#222" text-anchor="middle" font-weight="700">A, D</text><line x1="1221.6" y1="781.76" x2="1221.6" y2="747.76" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><text x="1221.6" y="797.76" font-size="13" fill="#222" text-anchor="middle" font-weight="700">B, E</text><line x1="1140" y1="624" x2="1174" y2="624" stroke="#222" stroke-width="2" marker-end="url(#arr)"/><text x="1130" y="628" font-size="13" fill="#222" text-anchor="middle" font-weight="700">C</text><text x="1180" y="825.76" font-size="12" fill="#777" text-anchor="start" font-weight="400">(C is the closed device</text><text x="1180" y="841.76" font-size="12" fill="#777" text-anchor="start" font-weight="400"> seen from its left edge)</text>
