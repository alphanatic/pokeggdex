<!-- legend -->
<text x="60" y="618" font-size="12" font-weight="700" fill="#8a0e10" letter-spacing="1">LEFT HALF</text><g><circle cx="70" cy="636" r="11" fill="#222"/><text x="70" y="640" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text></g><text x="88" y="640" font-size="14" fill="#333">Big blue lens (glows when scanning)</text><g><circle cx="70" cy="662" r="11" fill="#222"/><text x="70" y="666" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text></g><text x="88" y="666" font-size="14" fill="#333">Status lights: red, yellow, green</text><g><circle cx="70" cy="688" r="11" fill="#222"/><text x="70" y="692" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><text x="88" y="692" font-size="14" fill="#333">Main screen, white bezel with a cut corner</text><g><circle cx="70" cy="714" r="11" fill="#222"/><text x="70" y="718" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text></g><text x="88" y="718" font-size="14" fill="#333">Small green screen</text><g><circle cx="70" cy="740" r="11" fill="#222"/><text x="70" y="744" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text></g><text x="88" y="744" font-size="14" fill="#333">Two thin slots (hard to see in the episodes)</text><text x="480" y="618" font-size="12" font-weight="700" fill="#8a0e10" letter-spacing="1">HINGE</text><g><circle cx="490" cy="636" r="11" fill="#222"/><text x="490" y="640" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text></g><text x="508" y="640" font-size="14" fill="#333">Round hinge running the full height</text><text x="480" y="666" font-size="12" font-weight="700" fill="#8a0e10" letter-spacing="1">RIGHT HALF (the lid)</text><g><circle cx="490" cy="684" r="11" fill="#222"/><text x="490" y="688" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text></g><text x="508" y="688" font-size="14" fill="#333">Wide black display</text><g><circle cx="490" cy="710" r="11" fill="#222"/><text x="490" y="714" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text></g><text x="508" y="714" font-size="14" fill="#333">2 x 5 light-blue keys in a dark frame</text><g><circle cx="490" cy="736" r="11" fill="#222"/><text x="490" y="740" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">9</text></g><text x="508" y="740" font-size="14" fill="#333">Two small white buttons</text><g><circle cx="490" cy="762" r="11" fill="#222"/><text x="490" y="766" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text></g><text x="508" y="766" font-size="14" fill="#333">Small printed text</text><g><circle cx="490" cy="788" r="11" fill="#222"/><text x="490" y="792" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11</text></g><text x="508" y="792" font-size="14" fill="#333">Two dark rectangular pads</text><g><circle cx="490" cy="814" r="11" fill="#222"/><text x="490" y="818" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">12</text></g><text x="508" y="818" font-size="14" fill="#333">Orange round button</text><g><circle cx="490" cy="840" r="11" fill="#222"/><text x="490" y="844" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">13</text></g><text x="508" y="844" font-size="14" fill="#333">Step: tall by the hinge, low at the outer end</text><text x="900" y="618" font-size="12" font-weight="700" fill="#8a0e10" letter-spacing="1">CLOSED</text><g><circle cx="910" cy="636" r="11" fill="#222"/><text x="910" y="640" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">14</text></g><text x="928" y="640" font-size="14" fill="#333">The lid's low part leaves the lens + lights uncovered</text><g><circle cx="910" cy="662" r="11" fill="#222"/><text x="910" y="666" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">15</text></g><text x="928" y="666" font-size="14" fill="#333">Yellow triangle</text><g><circle cx="910" cy="688" r="11" fill="#222"/><text x="910" y="692" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">16</text></g><text x="928" y="692" font-size="14" fill="#333">Grip lines</text>
</svg>